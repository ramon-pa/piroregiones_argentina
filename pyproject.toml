[project]
name = "piroregiones-argentina"
version = "0.1.0"
description = "Pirorregiones de Argentina a partir de MapBiomas Fuego col-1 y cobertura col-3"
requires-python = ">=3.12"
# Dependencies are added with `uv add` when a step needs them, not before.
dependencies = [
    "earthengine-api",
    "geopandas>=1.2.0",
    "google-api-python-client>=2.201.0",
    "h3>=4.5.0",
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.0",
    "pygeoda>=0.1.3",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
]
